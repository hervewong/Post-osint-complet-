<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<title>Poste OSINT (Avancé)</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1c2128;--bd:#c8ccd4;--ac:#1f6feb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e2227;--card:#2d333b;--tx:#e6e6e6;--bd:#444c56;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1e2227;--card:#2d333b;--tx:#e6e6e6;--bd:#444c56;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px;z-index:9;border-bottom:1px solid var(--bd)}
.row{display:flex;gap:6px;margin:6px 0}
input,select,button,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px}
input,select,textarea{flex:1;min-width:0;width:100%;margin:3px 0}
button{cursor:pointer}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
nav button{white-space:nowrap}
nav button.on,#go{background:var(--ac);border-color:var(--ac);color:#fff}
main{padding:8px}
details,.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin:8px 0;padding:4px 10px}
.card.ac{border-color:var(--ac)}
summary{font-weight:600;padding:10px 0}
.r{display:flex;align-items:center;border-top:1px solid var(--bd)}
.r a{flex:1;padding:11px 6px;color:var(--tx);text-decoration:none}
.r small{display:block;opacity:.65;font-size:12px}
.fav-btn{background:none;border:none;cursor:pointer;font-size:18px;padding:0 8px;}
.sec{font-weight:600;margin:14px 4px 2px}
.hint{opacity:.75;padding:8px 2px;font-size:13px}
.actions-bar{display:flex;gap:6px;margin-bottom:8px}
</style>
</head>
<body>
<header>
  <div class="row">
    <input id="q" placeholder="Rechercher ou cible : mot-clé, domaine, IP, e-mail, pseudo…" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button id="gs" title="Rechercher">🔍</button>
    <button id="openAll" title="Ouvrir tous les liens filtrés">🚀 Tout ouvrir</button>
    <button id="th" title="Clair / sombre">◐</button>
  </div>
  <nav>
    <button data-t="all" class="on">Recherche</button>
    <button data-t="osint">OSINT</button>
    <button data-t="engines">Moteurs</button>
    <button data-t="favs">⭐ Favoris</button>
  </nav>
</header>
<main>
  <div id="out"></div>
  <div class="hint" id="st"></div>
  <div class="hint">Astuce : Cliquez sur l'étoile ⭐ à côté d'un outil pour l'ajouter à vos favoris. Sources publiques uniquement.</div>
</main>
<script>
const DATA={"osint":[{"g":"Domaine / IP","t":[{"n":"Whois","u":"https://who.is/whois/{q}"},{"n":"Enregistrements DNS","u":"https://viewdns.info/dnsrecord/?domain={q}"},{"n":"Certificats (crt.sh)","u":"https://crt.sh/?q={q}"},{"n":"Historique Wayback Machine","u":"https://web.archive.org/web/*/{q}","raw":1},{"n":"Archive.today","u":"https://archive.ph/{q}","raw":1},{"n":"urlscan.io","u":"https://urlscan.io/search/#{q}"},{"n":"VirusTotal","u":"https://www.virustotal.com/gui/search/{q}"},{"n":"Shodan","u":"https://www.shodan.io/search?query={q}"},{"n":"BuiltWith (technologies)","u":"https://builtwith.com/{q}"},{"n":"IPinfo","u":"https://ipinfo.io/{q}"},{"n":"AbuseIPDB","u":"https://www.abuseipdb.com/check/{q}"},{"n":"Robtex","u":"https://www.robtex.com/dns-lookup/{q}"},{"n":"Autres sites sur la même IP","u":"https://viewdns.info/reverseip/?host={q}&t=1"},{"n":"Historique des IP du domaine","u":"https://viewdns.info/iphistory/?domain={q}"},{"n":"BGP / réseau (Hurricane Electric)","u":"https://bgp.he.net/search?search%5Bsearch%5D={q}&commit=Search"},{"n":"Réputation (Cisco Talos)","u":"https://talosintelligence.com/reputation_center/lookup?search={q}"},{"n":"GreyNoise (IP)","u":"https://viz.greynoise.io/ip/{q}"},{"n":"Test SSL (SSL Labs)","u":"https://www.ssllabs.com/ssltest/analyze.html?d={q}"},{"n":"En-têtes de sécurité","u":"https://securityheaders.com/?q={q}"},{"n":"Google Safe Browsing","u":"https://transparencyreport.google.com/safe-browsing/search?url={q}"}]},{"g":"E-mail / pseudo","t":[{"n":"Epieos (e-mail)","u":"https://epieos.com/?q={q}"},{"n":"Have I Been Pwned (fuites)","u":"https://haveibeenpwned.com/"},{"n":"WhatsMyName (pseudo)","u":"https://whatsmyname.app/?q={q}"},{"n":"Recherche exacte \"{q}\"","u":"https://www.google.com/search?q=%22{q}%22"},{"n":"GitHub","u":"https://github.com/{q}"},{"n":"Reddit","u":"https://www.reddit.com/user/{q}"},{"n":"X (Twitter)","u":"https://x.com/{q}"},{"n":"Instagram","u":"https://www.instagram.com/{q}/"},{"n":"Intelligence X","u":"https://intelx.io/?s={q}"},{"n":"TikTok","u":"https://www.tiktok.com/@{q}"}]},{"g":"Entreprises","t":[{"n":"Pappers (France)","u":"https://www.pappers.fr/recherche?q={q}"},{"n":"Societe.com (France)","u":"https://www.societe.com/cgi-bin/search?champs={q}"},{"n":"OpenCorporates (monde)","u":"https://opencorporates.com/companies?q={q}"},{"n":"LinkedIn (via Google)","u":"https://www.google.com/search?q=site%3Alinkedin.com+%22{q}%22"},{"n":"ICIJ Offshore Leaks","u":"https://offshoreleaks.icij.org/search?q={q}"},{"n":"OpenSanctions (sanctions)","u":"https://www.opensanctions.org/search/?q={q}"}]},{"g":"Géolocalisation","t":[{"n":"OpenStreetMap","u":"https://www.openstreetmap.org/search?query={q}"},{"n":"Google Earth","u":"https://earth.google.com/web/search/{q}"},{"n":"FlightAware (n° de vol)","u":"https://www.flightaware.com/live/flight/{q}"}]}],"engines":[{"g":"Généralistes","t":[{"n":"Google","u":"https://www.google.com/search?q={q}"},{"n":"Bing","u":"https://www.bing.com/search?q={q}"},{"n":"DuckDuckGo","u":"https://duckduckgo.com/?q={q}"},{"n":"Brave","u":"https://search.brave.com/search?q={q}"},{"n":"Yandex","u":"https://yandex.com/search/?text={q}"}]}]};

const q = document.getElementById('q'), out = document.getElementById('out'), st = document.getElementById('st');
let tab = 'all';

// Gestion des favoris via localStorage
let favorites = JSON.parse(localStorage.getItem('osint_favs') || '[]');

function toggleFav(name, url, group) {
  const index = favorites.findIndex(f => f.n === name);
  if (index > -1) {
    favorites.splice(index, 1);
  } else {
    favorites.push({ n: name, u: url, g: group });
  }
  localStorage.setItem('osint_favs', JSON.stringify(favorites));
  render();
}

function render() {
  const val = q.value.trim();
  let html = '';
  let total = 0;
  let currentCats = [];

  if (tab === 'favs') {
    currentCats = [{ g: '⭐ Mes Outils Favoris', t: favorites }];
  } else {
    currentCats = tab === 'all' ? [...(DATA.osint || []), ...(DATA.engines || [])] : (DATA[tab] || []);
  }

  currentCats.forEach(cat => {
    let rows = '';
    cat.t.forEach(item => {
      let url = item.u;
      if (val) {
        url = url.replace(/{q}/g, encodeURIComponent(val));
      } else {
        url = url.split('?')[0];
      }

      // Filtrer par nom si l'utilisateur tape quelque chose qui ne correspond pas forcément à une cible technique
      const isFav = favorites.some(f => f.n === item.n);
      const starIcon = isFav ? '⭐' : '☆';

      rows += `
        <div class="r">
          <button class="fav-btn" onclick="toggleFav('${item.n.replace(/'/g, "\\'")}', '${item.u.replace(/'/g, "\\'")}', '${cat.g}')" title="Ajouter aux favoris">${starIcon}</button>
          <a href="${url}" target="_blank" rel="noopener" class="tool-link" data-url="${url}">
            ${item.n}
            <small>${url}</small>
          </a>
        </div>`;
      total++;
    });
    if (rows) {
      html += `<div class="card"><div class="sec">${cat.g}</div>${rows}</div>`;
    }
  });

  out.innerHTML = html || '<div class="card"><div class="hint">Aucun outil trouvé ou favori vide.</div></div>';
  st.textContent = `${total} outil(s) affiché(s)`;
}

// Ouvrir tous les liens affichés
document.getElementById('openAll').addEventListener('click', () => {
  const links = document.querySelectorAll('.tool-link');
  if(links.length > 15) {
    if(!confirm(`Attention, vous vous apprêtez à ouvrir ${links.length} onglets d'un coup. Continuer ?`)) return;
  }
  links.forEach(link => {
    window.open(link.getAttribute('href'), '_blank');
  });
});

q.addEventListener('input', render);
document.querySelectorAll('nav button').forEach(b => {
  b.addEventListener('click', e => {
    document.querySelectorAll('nav button').forEach(x => x.classList.remove('on'));
    e.target.classList.add('on');
    tab = e.target.dataset.t;
    render();
  });
});

document.getElementById('th').addEventListener('click', () => {
  const root = document.documentElement;
  root.setAttribute('data-theme', root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});

document.getElementById('gs').addEventListener('click', render);

// Initialisation
render();
</script>
</body>
</html>
